# Needed because we don't fully qualify all R references in the codebase (we use R.id instead of com.gpl.rpg.AndorsTrail.R.id... )
android.enableNonTransitiveRClass=false
# Enable gradle config cache for performance
org.gradle.configuration-cache=true
# Make sure gradle gets enough memory
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8